# Tax options of the direct method (percentage of revenue): one per business
# line, as a VAT rate and a personal income tax rate on revenue, each with a
# variant whose goods or services are not subject to VAT. `industry` groups
# the two variants in a picker. Revenue is the payment price, tax included;
# the tax is computed on it and never added to the price.
direct_options:
  basis: >-
    Luật Thuế giá trị gia tăng 48/2024/QH15; Luật Thuế thu nhập cá nhân 2025; Nghị định 68/2026/NĐ-CP
    về thuế đối với hộ, cá nhân kinh doanh (tỷ lệ % trên doanh thu theo ngành nghề).
  updated_on: '2026-11-18'
  verified: false
  items:
    - { code: direct.goods, industry: goods, name: 'Phân phối, cung cấp hàng hoá', vat_rate: '1', pit_rate: '0.5', valid_from: '2026-01-01', valid_to: null }
    - { code: direct.goods_vat_exempt, industry: goods, name: 'Phân phối, cung cấp hàng hoá', vat_rate: null, pit_rate: '0.5', valid_from: '2026-01-01', valid_to: null }
    - { code: direct.service, industry: service, name: 'Dịch vụ, xây dựng không bao thầu nguyên vật liệu', vat_rate: '5', pit_rate: '2', valid_from: '2026-01-01', valid_to: null }
    - { code: direct.service_vat_exempt, industry: service, name: 'Dịch vụ, xây dựng không bao thầu nguyên vật liệu', vat_rate: null, pit_rate: '2', valid_from: '2026-01-01', valid_to: null }
    - { code: direct.production_transport_food, industry: production_transport_food, name: 'Sản xuất, vận tải, dịch vụ gắn với hàng hoá (gồm dịch vụ ăn uống), xây dựng có bao thầu nguyên vật liệu', vat_rate: '3', pit_rate: '1.5', valid_from: '2026-01-01', valid_to: null }
    - { code: direct.production_transport_food_vat_exempt, industry: production_transport_food, name: 'Sản xuất, vận tải, dịch vụ gắn với hàng hoá (gồm dịch vụ ăn uống), xây dựng có bao thầu nguyên vật liệu', vat_rate: null, pit_rate: '1.5', valid_from: '2026-01-01', valid_to: null }
    - { code: direct.other, industry: other, name: 'Hoạt động kinh doanh khác', vat_rate: '2', pit_rate: '1', valid_from: '2026-01-01', valid_to: null }
