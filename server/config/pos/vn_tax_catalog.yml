# Vietnam tax catalog for the POS, read by Spree::Pos::VnTaxCatalog and
# checked at load: a block without items, a blank or repeated code, or a
# missing name stops the loader and fails
# spec/services/spree/pos/vn_tax_catalog_spec.rb.
#
# Each top-level key is one block. Every block records what it is based on
# (`basis`), when it was last checked (`updated_on`) and whether it has been
# compared with the official list (`verified`). A wrong entry is fixed here
# and in the spec, never in code. Rate blocks will be added under their own
# keys.

# Tax offices a taxpayer files with. From 01/07/2025 the tax administration
# is organized as one tax office per province or city (34, matching the
# provinces in vn_admin_units.json). Codes here are the province codes of
# that file, not the authority codes printed on declaration forms; compare
# them with the tax administration's list of tax offices before a
# declaration is generated from them.
tax_authorities:
  basis: >-
    Tổ chức lại hệ thống cơ quan thuế theo 34 tỉnh, thành phố từ 01/07/2025
    (Nghị quyết 202/2025/QH15 về sắp xếp đơn vị hành chính cấp tỉnh).
  updated_on: '2026-11-18'
  verified: false
  items:
    - { code: '01', name: 'Thuế thành phố Hà Nội' }
    - { code: '04', name: 'Thuế tỉnh Cao Bằng' }
