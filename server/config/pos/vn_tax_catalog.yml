  basis: >-
    Hệ thống ngành kinh tế Việt Nam (VSIC 2018), Quyết định 27/2018/QĐ-TTg; mã cấp 4,
    rút gọn cho bán lẻ, ăn uống, vui chơi giải trí và dịch vụ.
